name: Inward role guard pinned source and conditional exact math
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'PNDS/InwardRoleGuard.lean'
      - 'foundation/v1/INWARD_ROLE_GUARD.md'
      - 'foundation/v1/inward_role_guard.py'
      - 'tests/test_inward_role_guard_source.py'
      - '.github/workflows/inward-role-guard.yml'
permissions:
  contents: read
jobs:
  pinned-source-and-math:
    runs-on: ubuntu-latest
    env:
      TAC_SOURCE_COMMIT: f1cf90213cdc9daee161e99e017c55fdcbfb10cc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/TAC-OSM
          ref: f1cf90213cdc9daee161e99e017c55fdcbfb10cc
          path: tac
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy==2.3.5 pytest
      - run: pytest -q tests/test_inward_role_guard_source.py
        env:
          TAC_SOURCE_ROOT: tac
      - name: Compile typed graph and limited proofs
        run: |
          set -e
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake build PNDS.InwardRoleGuard
          lake env lean PNDS/InwardRoleGuardAudit.lean
