name: Protected sensor source and mathematical checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'PNDS/ProtectedSensor.lean'
      - 'foundation/v1/PROTECTED_SENSOR_ME105.md'
      - 'foundation/v1/protected_sensor_reference.py'
      - 'scripts/me105_graph_reference.py'
      - 'tests/test_protected_sensor_source.py'
      - '.github/workflows/protected-sensor-math.yml'
permissions:
  contents: read
jobs:
  source-math:
    runs-on: ubuntu-latest
    env:
      TAC_SOURCE_COMMIT: 573f81cb9f2f421d141ddb722525ecce25972edc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/TAC-OSM
          ref: 573f81cb9f2f421d141ddb722525ecce25972edc
          path: tac
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical test dependencies
        run: |
          python -m pip install numpy pytest
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Verify pinned source and byte-identical independent reference
        run: |
          test -n "$TAC_SOURCE_COMMIT"
          test "$(git -C tac rev-parse HEAD)" = "$TAC_SOURCE_COMMIT"
          cmp foundation/v1/protected_sensor_reference.py scripts/me105_graph_reference.py
          cmp foundation/v1/protected_sensor_reference.py tac/scripts/me105_graph_reference.py
      - name: Actual source forward, state, gradients, quantiles, CDF, and NLL
        env:
          TAC_SOURCE_ROOT: tac
        run: python -m pytest tests/test_protected_sensor_source.py -v
      - name: Install pinned Lean and compile scalar kernel
        run: |
          set -e
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake build PNDS.ProtectedSensor
          printf '%s\n' 'import PNDS.ProtectedSensor' '#print axioms PNDS.ProtectedSensor.serialFold_append' '#print axioms PNDS.ProtectedSensor.protectedScale_sq_floor' '#print axioms PNDS.ProtectedSensor.forward_left_floor' > /tmp/protected-sensor-audit.lean
          lake env lean /tmp/protected-sensor-audit.lean
