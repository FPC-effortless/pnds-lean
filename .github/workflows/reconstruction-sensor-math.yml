name: Reconstruction sensor source and mathematical checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'PNDS/ReconstructionSensor.lean'
      - 'foundation/v1/RECONSTRUCTION_SENSOR_ME102.md'
      - 'foundation/v1/reconstruction_sensor_reference.py'
      - 'scripts/me102_graph_reference.py'
      - 'tests/test_reconstruction_sensor_source.py'
      - '.github/workflows/reconstruction-sensor-math.yml'
permissions:
  contents: read
jobs:
  source-math:
    runs-on: ubuntu-latest
    env:
      TAC_SOURCE_COMMIT: bd7fe3c08f9979d34483d27dcd048eb5cec984e3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/TAC-OSM
          ref: bd7fe3c08f9979d34483d27dcd048eb5cec984e3
          path: tac-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Verify pinned source and byte-identical independent reference
        run: |
          test -n "$TAC_SOURCE_COMMIT"
          test "$(git -C tac-source rev-parse HEAD)" = "$TAC_SOURCE_COMMIT"
          cmp foundation/v1/reconstruction_sensor_reference.py scripts/me102_graph_reference.py
          cmp foundation/v1/reconstruction_sensor_reference.py tac-source/scripts/me102_graph_reference.py
      - name: Actual source forward, state, reconstruction, and gradient parity
        run: TAC_SOURCE_ROOT=tac-source python -m unittest tests/test_reconstruction_sensor_source.py -v
      - name: Install pinned Lean and compile scalar kernel
        run: |
          set -e
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake build PNDS.ReconstructionSensor
          printf '%s\n' 'import PNDS.ReconstructionSensor' '#print axioms PNDS.ReconstructionSensor.currentVariance_nonneg' '#print axioms PNDS.ReconstructionSensor.currentVariance_at_least_fixed_floor' '#print axioms PNDS.ReconstructionSensor.futureVariance_at_least_floor' '#print axioms PNDS.ReconstructionSensor.futureVariance_at_least_inherited_noise' '#print axioms PNDS.ReconstructionSensor.futureVariance_positive_of_nonzero_noise' '#print axioms PNDS.ReconstructionSensor.futureMean_unchanged_when_observed' '#print axioms PNDS.ReconstructionSensor.futureVariance_unchanged_when_observed' '#print axioms PNDS.ReconstructionSensor.ageFloor_monotone' '#print axioms PNDS.ReconstructionSensor.futureVariance_monotone_age' '#print axioms PNDS.ReconstructionSensor.readTrace_preserves_trace' > /tmp/reconstruction-sensor-audit.lean
          lake env lean /tmp/reconstruction-sensor-audit.lean
