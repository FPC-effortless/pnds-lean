name: LANG10M001 partial math Lean and Python checks
on:
  pull_request:
    paths:
      - 'PNDS/LANG10M001.lean'
      - 'foundation/v1/lang10m001_reference.py'
      - 'foundation/v1/test_lang10m001_reference.py'
      - 'foundation/v1/prospective/LANG10M001_LINK.json'
      - '.github/workflows/lang10m001.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  partial-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pytest==8.4.2
      - name: Partial mathematical reference tests, no trained capability
        run: python -m pytest -q foundation/v1/test_lang10m001_reference.py
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update
      - name: Compile exact new Lean module
        run: lake build PNDS.LANG10M001
