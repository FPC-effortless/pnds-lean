name: LANGCAP103 exact-real graph and source registry
on:
  pull_request:
    paths:
      - 'PNDS/LANGCAP103.lean'
      - 'foundation/langcap103/**'
      - '.github/workflows/langcap103.yml'
permissions:
  contents: read
jobs:
  graph-equations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify source/equation content pins and open-proof status
        run: |
          python foundation/langcap103/validate.py
          python -m py_compile foundation/langcap103/reference.py
      - name: Install declared Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib and compiled cache
        run: |
          lake update
          lake exe cache get
      - name: Elaborate full graph definitions and print the five theorem axiom sets
        run: |
          set -o pipefail
          lake env lean PNDS/LANGCAP103.lean 2>&1 | tee langcap103-lean.log
          if grep -E 'sorryAx|declaration uses .sorry.' langcap103-lean.log; then exit 1; fi
          test "$(grep -c 'depends on axioms\|does not depend on any axioms' langcap103-lean.log)" -eq 5
      - name: Preserve formal elaboration and axiom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGCAP103-Lean-graph-and-axiom-audit
          path: |
            langcap103-lean.log
            foundation/langcap103/SOURCE_MAP.json
          retention-days: 90
