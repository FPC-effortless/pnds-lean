name: CONTEXT028 exact-real full graph and prefix causality
on:
  pull_request:
    paths:
      - 'PNDS/ContextGraph028.lean'
      - 'foundation/v1/context028.json'
      - '.github/workflows/context028.yml'
permissions:
  contents: read
jobs:
  full-graph-formulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned Lean and mathlib
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          lake update
          lake exe cache get
      - name: Compile complete chronological graph and inspect all four theorem axioms
        run: |
          set -o pipefail
          lake env lean PNDS/ContextGraph028.lean 2>&1 | tee context028-axioms.log
          test "$(grep -c 'PNDS.ContextGraph028.' context028-axioms.log)" -eq 4
          if grep -E 'sorryAx|declaration uses.*sorry|error:' context028-axioms.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CONTEXT028-full-graph-exact-real-axioms
          path: context028-axioms.log
