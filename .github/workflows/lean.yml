name: Lean

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Verify Mathlib was actually resolved
        run: |
          set -e
          if ! grep -q "leanprover-community/mathlib4" lake-manifest.json; then
            echo "::error::Mathlib is not in lake-manifest.json; the build would be a no-op"
            exit 1
          fi
          echo "Mathlib resolved"

      - name: Build
        run: lake build 2>&1 | tee build.log

      - name: Verify the tree actually compiled
        run: |
          set -e
          n=$(find . -name "*.olean" -path "*PNDS*" | wc -l)
          echo "PNDS .olean files produced: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::No PNDS .olean files were produced; lake build compiled nothing"
            exit 1
          fi

      - name: Fail on sorry in build output
        run: |
          set -e
          if grep -n "sorry" build.log; then
            echo "::error::sorry present in the build output"
            exit 1
          fi
          echo "no sorry in build output: clean"

      - name: Print axioms
        run: |
          lake env lean PNDS.lean 2>&1 | grep -E "axioms|sorry" || true
