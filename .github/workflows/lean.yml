name: Lean

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate unified source-pinned foundation and negative findings
        run: |
          python3 scripts/validate_foundation.py --strict
          python3 scripts/validate_variant_math.py
          python3 scripts/check_reciprocal_links.py
          python3 -m unittest discover -s tests -p 'test_foundation.py' -v
          python3 -m unittest discover -s tests -p 'test_variant_math.py' -v
          python3 -m unittest foundation.langcache104.test_math_reference -v
          python3 -m unittest foundation.langcache104.test_reciprocal_candidate -v
          python3 -m unittest foundation.tac_ocr001.test_math_reference -v
          python3 -m unittest foundation.tac_ocr001.test_reciprocal_candidate -v
          python3 -m unittest foundation.tac_ocr004.test_immutable_peer foundation.tac_ocr004.test_dispatch -v

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Fetch version-matched Mathlib object cache
        run: lake exe cache get

      - name: Verify Mathlib was actually resolved
        run: |
          set -e
          if ! grep -q "leanprover-community/mathlib4" lake-manifest.json; then
            echo "::error::Mathlib is not in lake-manifest.json; the build would be a no-op"
            exit 1
          fi
          echo "Mathlib resolved"

      - name: Build (explicit roots, so nothing can be silently skipped)
        run: |
          # `lake build ... | tee` would mask lake's exit code behind tee's, which
          # has already produced a false-green run on this repo. Use PIPESTATUS.
          set -o pipefail
          lake build 'PNDS' 'PNDS.LANGCACHE104' 'PNDS.TACOCR001' 'Audit' 2>&1 | tee build.log
          echo "lake build exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Verify the tree actually compiled
        run: |
          set -e
          # Counting .olean files is not sufficient: a single successfully-built
          # module (e.g. PNDS.Causal) already produces one, so a tree with five
          # broken modules passed this check. Require every root to be present.
          for root in PNDS/TACOCR001 PNDS/LANGCACHE104 PNDS/TACOSMVariantContracts PNDS/UnifiedTACOSM PNDS/Causal PNDS/PathVerification PNDS/Registration \
                      PNDS/Scaling PNDS/Statistics PNDS/Softmax Audit; do
            if [ ! -f ".lake/build/lib/${root}.olean" ]; then
              echo "::error::Missing .olean for ${root}; that module did not compile"
              exit 1
            fi
          done
          n=$(find .lake/build -name "*.olean" | wc -l)
          echo ".olean files produced under .lake/build: $n"

      - name: Fail on sorry in build output
        run: |
          set -e
          if grep -n "sorry" build.log; then
            echo "::error::sorry present in the build output"
            exit 1
          fi
          echo "no sorry in build output: clean"

      - name: Print axioms
        run: |
          lake env lean PNDS.lean 2>&1 | grep -E "axioms|sorry" || true

      - name: Audit LANGCACHE104 scoped algebra without masking compiler failure
        run: |
          set -euo pipefail
          lake env lean Audit.lean 2>&1 | tee langcache104-axioms.log
          if grep -q 'sorryAx' langcache104-axioms.log; then
            echo "::error::Admitted goal in LANGCACHE104 or inherited audit"
            exit 1
          fi
          for theorem in cone_coordinate affine_composition affine_associative; do
            grep -q "PNDS.LANGCACHE104.${theorem}" langcache104-axioms.log
          done
      - name: Audit scoped OCR reference capacity theorem
        run: |
          set -euo pipefail
          lake env lean PNDS/TACOCR001.lean 2>&1 | tee tac-ocr001-axioms.log
          if grep -q 'sorryAx' tac-ocr001-axioms.log; then exit 1; fi
          grep -q 'PNDS.TACOCR001.referenceCountBound' tac-ocr001-axioms.log
