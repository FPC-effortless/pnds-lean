name: Lean

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate unified source-pinned foundation and negative findings
        run: |
          python3 scripts/validate_foundation.py --strict
          python3 scripts/validate_variant_math.py
          python3 scripts/check_reciprocal_links.py
          python3 -m unittest discover -s tests -p 'test_foundation.py' -v
          python3 -m unittest discover -s tests -p 'test_variant_math.py' -v
          python3 -m unittest discover -s tests -p 'test_langmem085_selective_delta.py' -v

      - name: LANGMEM086 independent mathematical reference
        run: python3 -m unittest discover -s tests -p test_langmem086_autonomous.py -v

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Verify Mathlib was actually resolved
        run: |
          set -e
          if ! grep -q "leanprover-community/mathlib4" lake-manifest.json; then
            echo "::error::Mathlib is not in lake-manifest.json; the build would be a no-op"
            exit 1
          fi
          echo "Mathlib resolved"

      - name: Build (explicit roots, so nothing can be silently skipped)
        run: |
          # `lake build ... | tee` would mask lake's exit code behind tee's, which
          # has already produced a false-green run on this repo. Use PIPESTATUS.
          set -o pipefail
          lake build 'PNDS' 'Audit' 'PNDS.LangMem085Selective' 'PNDS.LangMem086Autonomous' 'PNDS.LangMem087Historical' 'PNDS.ArchFuse089' 2>&1 | tee build.log
          echo "lake build exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Verify the tree actually compiled
        run: |
          set -e
          # Counting .olean files is not sufficient: a single successfully-built
          # module (e.g. PNDS.Causal) already produces one, so a tree with five
          # broken modules passed this check. Require every root to be present.
          for root in PNDS/TACOSMVariantContracts PNDS/UnifiedTACOSM PNDS/Causal PNDS/PathVerification PNDS/Registration \
                      PNDS/Scaling PNDS/Statistics PNDS/Softmax PNDS/LangMem085Selective PNDS/LangMem086Autonomous PNDS/LangMem087Historical PNDS/ArchFuse089 Audit; do
            if [ ! -f ".lake/build/lib/${root}.olean" ]; then
              echo "::error::Missing .olean for ${root}; that module did not compile"
              exit 1
            fi
          done
          n=$(find .lake/build -name "*.olean" | wc -l)
          echo ".olean files produced under .lake/build: $n"

      - name: Fail on sorry in build output
        run: |
          set -e
          if grep -n "sorry" build.log; then
            echo "::error::sorry present in the build output"
            exit 1
          fi
          echo "no sorry in build output: clean"

      - name: Print axioms
        run: |
          lake env lean PNDS.lean 2>&1 | grep -E "axioms|sorry" || true

      - name: LANGMEM086 scoped axiom audit
        run: |
          set -o pipefail
          lake env lean PNDS/LangMem086Autonomous.lean 2>&1 | tee langmem086-axioms.log
          if grep -E "sorryAx|declaration uses .sorry." langmem086-axioms.log; then exit 1; fi

      - name: LANGMEM087 partial historical decomposition and axiom audit
        run: |
          python3 -m unittest discover -s tests -p test_langmem087_historical.py -v
          set -o pipefail
          lake env lean PNDS/LangMem087Historical.lean 2>&1 | tee langmem087-axioms.log
          if grep -E "sorryAx|declaration uses .sorry." langmem087-axioms.log; then exit 1; fi

      - name: ARCHFUSE089 actual new Lean module and Python reference tests
        run: |
          python3 -m unittest discover -s foundation/v1 -p test_archfuse089_channel.py -v
          set -o pipefail
          lake env lean PNDS/ArchFuse089.lean 2>&1 | tee archfuse089-axioms.log
          if grep -E "sorryAx|declaration uses .sorry." archfuse089-axioms.log; then exit 1; fi
