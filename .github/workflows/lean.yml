name: Lean

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean via elan
        uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Build
        run: lake build 2>&1 | tee build.log

      - name: Fail on sorry in build output
        run: |
          set -e
          if grep -n "sorry" build.log; then
            echo "::error::sorry present in the build output"
            exit 1
          fi
          echo "no sorry in build output: clean"

      - name: Print axioms
        run: |
          lake env lean PNDS.lean 2>&1 | grep -E "axioms|sorry" || true
