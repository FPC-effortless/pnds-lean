name: LANGACQUIRE097 objective mathematics

on:
  pull_request:
    paths:
      - 'PNDS/LANGACQUIRE097.lean'
      - 'foundation/v1/langacquire097*'
      - 'foundation/v1/test_langacquire097_reference.py'
      - '.github/workflows/langacquire097.yml'
      - 'lakefile.toml'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  objective-reference-and-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source-pinned draft reciprocal snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import urllib.request
          tac_metadata = '6e751c3e6f79039dff62b7aecb99803a8accbd6e'
          source = '21c388a5077eeb4d065624838019253276029f0b'
          proof = '1573f5e103bfa490c30173a900cb820d57be576f'
          url = ('https://raw.githubusercontent.com/FPC-effortless/TAC-OSM/'
                 + tac_metadata + '/research/pnds-variant-math-links.json')
          local = json.loads(Path('foundation/v1/variant-math-links.json').read_text())
          with urllib.request.urlopen(url, timeout=30) as response:
              remote = json.loads(response.read().decode('utf-8'))
          assert local == remote, 'Pinned draft reciprocal manifests differ'
          rows = [row for row in local.get('prospective_training_candidates', [])
                  if row.get('id') == 'LANGACQUIRE097']
          assert len(rows) == 1, 'Missing or duplicate prospective source record'
          row = rows[0]
          assert row['tac']['commit'] == source, 'Wrong experiment code source'
          assert row['pnds']['commit'] == proof, 'Wrong mathematical source'
          assert row['lean_full_graph_proved'] is False
          assert row['python_source_equivalence_verified'] is False
          assert row['real_world_capability_inferred'] is False
          receipt = {
              'status': 'DRAFT_PINNED_RECIPROCAL_EQUAL',
              'tac_metadata_commit': tac_metadata,
              'tac_implementation_commit': source,
              'pnds_operator_source_commit': proof,
              'canonical_main_master_reciprocal_parity': 'OPEN_UNMERGED',
              'whole_model_source_equivalence_established': False,
              'mathematical_release_established': False,
          }
          Path('langacquire097-draft-reciprocal.json').write_text(
              json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Check independent objective reference
        run: |
          python -m pip install numpy==2.3.5
          python -m unittest discover -s foundation/v1 -p test_langacquire097_reference.py -v
      - name: Install elan using repository toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: pnds-langmath095-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Resolve pinned Mathlib and compiled dependencies
        run: |
          lake update
          python - <<'PY'
          import json
          manifest = json.load(open('lake-manifest.json'))
          assert any(p.get('name') == 'mathlib' for p in manifest['packages']), 'Mathlib absent'
          PY
          lake exe cache get
      - name: Compile objective contracts and inspect theorem axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean PNDS/LANGACQUIRE097.lean 2>&1 | tee langacquire097-lean.log
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('langacquire097-lean.log').read_text()
          assert 'sorryAx' not in text, 'Unproved Lean placeholder'
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for group in re.findall(r'depends on axioms:\s*\[([^\]]*)\]', text):
              found = {a.strip() for a in group.split(',') if a.strip()}
              assert found <= allowed, f'Unexpected axioms: {found - allowed}'
          names = (
              'unroll_nil', 'unroll_append', 'unroll_three_chunks',
              'masked_total_congr_active', 'masked_mean_congr_active',
              'all_active_mean_and_positive_mass', 'inactive_loss_irrelevance',
              'acquisition_query_chain', 'direct_and_acquisition_chain',
          )
          for name in names:
              assert f'PNDS.LANGACQUIRE097.{name}' in text, f'Missing inspection: {name}'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langacquire097-lean-axiom-log
          path: |
            langacquire097-lean.log
            langacquire097-draft-reciprocal.json
          if-no-files-found: warn
