name: LANGMATH095 operator mathematics

on:
  pull_request:
    paths:
      - 'PNDS/LANGMATH095.lean'
      - 'foundation/v1/langmath095*'
      - '.github/workflows/langmath095.yml'
      - 'lakefile.toml'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-reference-and-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check independent numerical reference
        run: |
          python -m pip install numpy==2.3.2
          python -m unittest discover -s foundation/v1 -p test_langmath095_reference.py -v
      - name: Install elan using repository toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: pnds-langmath095-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Resolve pinned Mathlib and fetch compiled dependencies
        run: |
          lake update
          python - <<'PY'
          import json
          manifest = json.load(open('lake-manifest.json'))
          assert any(p.get('name') == 'mathlib' for p in manifest['packages']), 'Mathlib absent'
          PY
          lake exe cache get
      - name: Compile the new module explicitly and inspect printed axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean PNDS/LANGMATH095.lean 2>&1 | tee langmath095-lean.log
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('langmath095-lean.log').read_text()
          assert 'sorryAx' not in text, 'Unproved Lean placeholder'
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for group in re.findall(r'depends on axioms:\s*\[([^\]]*)\]', text):
              found = {a.strip() for a in group.split(',') if a.strip()}
              assert found <= allowed, f'Unexpected axiom dependencies: {found - allowed}'
          names = (
              'compose_assoc', 'compose_identity_left', 'compose_identity_right',
              'apply_composed', 'nonwrite_preserves', 'retention_difference',
              'convex_retention', 'fixed_key_equilibrium', 'bounded_write_envelope',
          )
          for name in names:
              assert f'PNDS.LANGMATH095.{name}' in text, f'Missing axiom inspection: {name}'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langmath095-lean-axiom-log
          path: langmath095-lean.log
          if-no-files-found: warn
