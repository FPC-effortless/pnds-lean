name: LANGCONTROL098 coefficient mathematics
on:
  pull_request:
    paths:
      - 'PNDS/LANGCONTROL098.lean'
      - 'foundation/v1/LANGCONTROL098_GRAPH.md'
      - 'foundation/v1/langcontrol098*'
      - 'foundation/v1/test_langcontrol098_reference.py'
      - 'scripts/check_langcontrol098_source.py'
      - '.github/workflows/langcontrol098.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coefficient-reference-and-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact prospective objective and inherited model source
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_langcontrol098_source.py | tee langcontrol098-source-digests.json
      - name: Independent coefficient and logit-gradient reference
        run: |
          python -m pip install numpy==2.3.5
          python -m unittest discover -s foundation/v1 -p test_langcontrol098_reference.py -v
      - name: Install Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: pnds-langcontrol098-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Resolve pinned Mathlib and compiled dependencies
        run: |
          lake update
          lake exe cache get
      - name: Compile equations and inspect all theorem axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean PNDS/LANGCONTROL098.lean 2>&1 | tee langcontrol098-lean.log
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('langcontrol098-lean.log').read_text()
          assert 'sorryAx' not in text
          allowed = {'propext','Classical.choice','Quot.sound'}
          names = ('future_coefficient_fixed','future_coefficient_value',
                   'prefix_coefficient_zero','prefix_coefficient_one',
                   'padding_coefficient_zero','future_coefficient_positive',
                   'query_only','prefix_added','objective_contrast',
                   'zero_weight_loss_irrelevant','controlled_derivative')
          for name in names:
              assert 'PNDS.LANGCONTROL098.'+name in text, name
          for group in re.findall(r'depends on axioms:\s*\[([^\]]*)\]',text):
              assert {a.strip() for a in group.split(',') if a.strip()} <= allowed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langcontrol098-lean-axiom-log
          path: |
            langcontrol098-lean.log
            langcontrol098-source-digests.json
          if-no-files-found: warn
