name: Prospective PNDS 500K numerical contracts
on:
  push:
    branches: [ research/scale-500k-wave-language-2026-10-28 ]
  pull_request:
  workflow_dispatch:
jobs:
  math-kernels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: 500K budget and independent wave / CED kernels
        run: |
          python -m unittest discover -s tests -p 'test_parameter_scale_500k.py' -v
          python -m unittest discover -s tests -p 'test_language_wave_500k_math.py' -v
