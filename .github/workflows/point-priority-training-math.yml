name: Point-priority training source and mathematical checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'PNDS/PointPriorityTraining.lean'
      - 'PNDS/SensorGraph105.lean'
      - 'foundation/v1/POINT_PRIORITY_ME106.md'
      - 'foundation/v1/point_priority_reference.py'
      - 'scripts/me106_graph_reference.py'
      - 'tests/test_point_priority_source.py'
      - 'tests/test_protected_sensor_source.py'
      - '.github/workflows/point-priority-training-math.yml'
permissions:
  contents: read
jobs:
  source-math:
    runs-on: ubuntu-latest
    env:
      TAC_SOURCE_COMMIT: adb71873a8ddf9939f9c185b47e24a68927b5122
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/TAC-OSM
          ref: adb71873a8ddf9939f9c185b47e24a68927b5122
          path: tac
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical test dependencies
        run: |
          python -m pip install numpy pytest
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Verify pinned source and byte-identical independent reference
        run: |
          test -n "$TAC_SOURCE_COMMIT"
          test "$(git -C tac rev-parse HEAD)" = "$TAC_SOURCE_COMMIT"
          cmp foundation/v1/point_priority_reference.py scripts/me106_graph_reference.py
          cmp foundation/v1/point_priority_reference.py tac/scripts/me106_graph_reference.py
      - name: Actual source forward, state, gradients, quantiles, CDF, and NLL
        env:
          TAC_SOURCE_ROOT: tac
        run: python -m pytest tests/test_point_priority_source.py tests/test_protected_sensor_source.py -v
      - name: Install pinned Lean and compile scalar kernel
        run: |
          set -e
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake build PNDS.PointPriorityTraining PNDS.SensorGraph105
          printf '%s\n' 'import PNDS.PointPriorityTraining' '#print axioms PNDS.PointPriorityTraining.projected_dot_nonneg' '#print axioms PNDS.PointPriorityTraining.total_dot_lower_bound' '#print axioms PNDS.PointPriorityTraining.uncertainty_location_tangent_cancels' > /tmp/point-priority-audit.lean
          lake env lean /tmp/point-priority-audit.lean
