name: Median split sensor source and mathematical checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'PNDS/MedianSplitSensor.lean'
      - 'foundation/v1/MEDIAN_SPLIT_SENSOR_ME104.md'
      - 'foundation/v1/median_split_sensor_reference.py'
      - 'scripts/me104_graph_reference.py'
      - 'tests/test_median_split_sensor_source.py'
      - '.github/workflows/median-split-sensor-math.yml'
permissions:
  contents: read
jobs:
  source-math:
    runs-on: ubuntu-latest
    env:
      TAC_SOURCE_COMMIT: 89d756d5235ddd4fd8128bfa5388eb53ef849db6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/TAC-OSM
          ref: 89d756d5235ddd4fd8128bfa5388eb53ef849db6
          path: tac
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical test dependencies
        run: |
          python -m pip install numpy pytest
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Verify pinned source and byte-identical independent reference
        run: |
          test -n "$TAC_SOURCE_COMMIT"
          test "$(git -C tac rev-parse HEAD)" = "$TAC_SOURCE_COMMIT"
          cmp foundation/v1/median_split_sensor_reference.py scripts/me104_graph_reference.py
          cmp foundation/v1/median_split_sensor_reference.py tac/scripts/me104_graph_reference.py
      - name: Actual source forward, state, gradients, quantiles, CDF, and NLL
        env:
          TAC_SOURCE_ROOT: tac
        run: python -m pytest tests/test_median_split_sensor_source.py -v
      - name: Install pinned Lean and compile scalar kernel
        run: |
          set -e
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake build PNDS.MedianSplitSensor
          printf '%s\n' 'import PNDS.MedianSplitSensor' '#print axioms PNDS.MedianSplitSensor.leftScale_positive' '#print axioms PNDS.MedianSplitSensor.rightScale_positive' '#print axioms PNDS.MedianSplitSensor.medianLocation_unchanged' '#print axioms PNDS.MedianSplitSensor.leftScale_modifier_zero' '#print axioms PNDS.MedianSplitSensor.rightScale_modifier_zero' '#print axioms PNDS.MedianSplitSensor.exponentialScale_lower_bound' > /tmp/median-split-sensor-audit.lean
          lake env lean /tmp/median-split-sensor-audit.lean
