name: TEMP020 scalar layer Lean and Python
on:
  pull_request:
    paths:
      - 'PNDS/ScalarCalibration020.lean'
      - 'foundation/v1/temperature020*'
      - 'tests/test_temperature020.py'
      - '.github/workflows/temperature020.yml'
permissions:
  contents: read
jobs:
  scalar-layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python reference mathematical fixtures
        run: python3 -m unittest discover -s tests -p test_temperature020.py -v
      - name: Install pinned Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve exact pinned mathlib and cache
        run: |
          lake update
          lake exe cache get
      - name: Build actual scalar module and inspect every theorem
        run: |
          set -o pipefail
          lake env lean PNDS/ScalarCalibration020.lean 2>&1 | tee scalar-axioms.log
          test "$(grep -c 'PNDS.ScalarCalibration020.' scalar-axioms.log)" -eq 4
          if grep -E 'sorryAx|declaration uses.*sorry|error:' scalar-axioms.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temperature020-scoped-math-only
          path: scalar-axioms.log
