name: ME111 conditional belief law, roles and Lean contract

on:
  pull_request:
    branches: [research/me110-typed-role-training-2026-10-26]
    paths:
      - 'PNDS/CoherentConditionalBelief*.lean'
      - 'foundation/v1/coherent_conditional_belief_reference.py'
      - 'foundation/v1/ME111_COHERENT_CONDITIONAL_BELIEF.md'
      - 'foundation/v1/variant-math-links.json'
      - 'tests/test_coherent_conditional_belief*.py'
      - '.github/workflows/me111-conditional-belief-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scalar-source-parity-and-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/TAC-OSM
          ref: b0f6d8ea0ad119e40ba1d503f6f9a01e39b1d477
          path: tac-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned parity dependencies
        run: |
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy==2.3.5
      - name: Check reference laws, all source masks and routed gradients
        env:
          ME111_TAC_SOURCE: tac-source
          PYTHONPATH: tac-source/src:.
        run: python -m pytest -q tests/test_coherent_conditional_belief_reference.py tests/test_coherent_conditional_belief_source.py
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean toolchain
        run: |
          for attempt in 1 2 3 4 5; do
            elan toolchain install leanprover/lean4:v4.14.0 && exit 0
            sleep 10
          done
          exit 1
      - name: Resolve pinned dependencies
        run: lake update
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Build actual-real and standalone contracts
        run: lake build PNDS.CoherentConditionalBelief PNDS.CoherentConditionalBeliefStandalone
      - name: Audit actual-real theorem axioms
        run: |
          cat > ConditionalBeliefAudit.lean <<'LEAN'
          import PNDS.CoherentConditionalBelief
          #print axioms PNDS.CoherentConditionalBeliefReal.variance_positive
          #print axioms PNDS.CoherentConditionalBeliefReal.sigma_positive
          #print axioms PNDS.CoherentConditionalBeliefReal.observed_variance
          #print axioms PNDS.CoherentConditionalBeliefReal.quantile_order
          #print axioms PNDS.CoherentConditionalBeliefReal.mean_supervised
          #print axioms PNDS.CoherentConditionalBeliefReal.other_point
          #print axioms PNDS.CoherentConditionalBeliefReal.uncertainty_only
          LEAN
          lake env lean ConditionalBeliefAudit.lean 2>&1 | tee conditional-belief-axioms.log
          if grep -q 'sorryAx' conditional-belief-axioms.log; then exit 1; fi
