name: ME110 typed role source and Lean contract

on:
  pull_request:
    branches: [research/inward-role-guard-2026-10-26]
    paths:
      - 'PNDS/TypedRoleTraining.lean'
      - 'foundation/v1/typed_role_training_reference.py'
      - 'foundation/v1/ME110_TYPED_ROLE_TRAINING.md'
      - 'tests/test_typed_role_training_source.py'
      - '.github/workflows/me110-typed-role-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-parity-and-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/TAC-OSM
          ref: edb9a3d4f590de386ad985cdc0f8ff5556a25a5d
          path: tac-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned source parity dependencies
        run: |
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy==2.3.5
      - name: Compare all source masks and routed gradients
        env:
          ME110_TAC_SOURCE: tac-source
          PYTHONPATH: tac-source/src:.
        run: python -m pytest -q tests/test_typed_role_training_source.py
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Resolve pinned Lean dependencies
        run: lake update
      - name: Build the ME110 Lean module
        run: lake build PNDS.TypedRoleTraining
      - name: Audit theorem axioms
        run: |
          cat > TypedRoleTrainingAudit.lean <<'EOF'
          import PNDS.TypedRoleTraining
          #print axioms PNDS.TypedRoleTraining.point_masked_coordinate
          #print axioms PNDS.TypedRoleTraining.uncertainty_masked_coordinate
          #print axioms PNDS.TypedRoleTraining.masks_disjoint
          #print axioms PNDS.TypedRoleTraining.masks_sum_to_one
          #print axioms PNDS.TypedRoleTraining.decoder_congruent_under_uncertainty_update
          EOF
          lake env lean TypedRoleTrainingAudit.lean 2>&1 | tee typed-role-axioms.log
          if grep -q 'sorryAx' typed-role-axioms.log; then
            echo 'Unexpected sorryAx dependency in ME110 theorem audit' >&2
            exit 1
          fi
