name: ME107 role FFN actual-source and exact math
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'PNDS/RoleSpecializedFFN.lean'
      - 'foundation/v1/ROLE_SPECIALIZED_ME107.md'
      - 'foundation/v1/role_specialized_reference.py'
      - 'tests/test_role_specialized_source.py'
      - '.github/workflows/role-specialized-ffn.yml'
permissions:
  contents: read
jobs:
  pinned-source-and-math:
    runs-on: ubuntu-latest
    env:
      TAC_SOURCE_COMMIT: ddf04323ea352ef5ce80d2047074d54a9a047198
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/TAC-OSM
          ref: ddf04323ea352ef5ce80d2047074d54a9a047198
          path: tac
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy==2.3.5 pytest
      - run: cmp foundation/v1/role_specialized_reference.py tac/scripts/me107_graph_reference.py
      - run: pytest -q tests/test_role_specialized_source.py
        env:
          TAC_SOURCE_ROOT: tac
      - name: Compile typed graph and limited proofs
        run: |
          set -e
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake build PNDS.RoleSpecializedFFN
          printf '%s\n' 'import PNDS.RoleSpecializedFFN' '#print axioms PNDS.RoleSpecializedFFN.protected_dot_nonpos' '#print axioms PNDS.RoleSpecializedFFN.zero_protected_coordinate_unchanged' '#print axioms PNDS.RoleSpecializedFFN.roleSpecializedParameterCount_exact' > /tmp/role-axioms.lean
          lake env lean /tmp/role-axioms.lean
