name: Belief sensor source and mathematical checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'PNDS/BeliefSensor.lean'
      - 'PNDS/SourceAlignedTrace.lean'
      - 'foundation/v1/ENTITY_SENSOR_BELIEF_ME101.md'
      - 'foundation/v1/belief_sensor_reference.py'
      - 'foundation/v1/entity_sensor_reference.py'
      - 'tests/test_belief_sensor_source.py'
      - '.github/workflows/belief-sensor-math.yml'
permissions:
  contents: read
jobs:
  source-math:
    runs-on: ubuntu-latest
    env:
      TAC_SOURCE_COMMIT: 493032ff7210604d6123a923d0d1a786607552ea
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/TAC-OSM
          ref: 493032ff7210604d6123a923d0d1a786607552ea
          path: tac-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Actual source forward, uncertainty, state, and gradient parity
        run: TAC_SOURCE_ROOT=tac-source python -m unittest tests/test_belief_sensor_source.py -v
      - name: Install pinned Lean and compile scalar kernel
        run: |
          set -e
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake build PNDS.BeliefSensor
          printf '%s\n' 'import PNDS.BeliefSensor' '#print axioms PNDS.BeliefSensor.latentVariance_observed_zero' '#print axioms PNDS.BeliefSensor.latentVariance_nonneg' '#print axioms PNDS.BeliefSensor.latentVariance_monotone_age' '#print axioms PNDS.BeliefSensor.marginalizedVariance_positive' '#print axioms PNDS.BeliefSensor.readTrace_preserves_trace' > /tmp/belief-sensor-audit.lean
          lake env lean /tmp/belief-sensor-audit.lean
